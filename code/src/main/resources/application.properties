spring.application.name=plantpal

# ---- PostgreSQL (แก้ชื่อ DB / user / password ให้ตรงเครื่อง) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/plantpal
spring.datasource.username=postgres
spring.datasource.password=postgres

# ให้ Hibernate สร้าง/อัปเดตตารางจาก Entity เอง (ไม่ต้องเขียน SQL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- อัปโหลดรูป (Cloudinary) ----
# ห้ามใส่ key ตรงนี้ (repo เป็น public) ให้ตั้ง environment variable ชื่อ CLOUDINARY_URL ในเครื่อง / บน Railway แทน
# รูปแบบ: cloudinary://<api_key>:<api_secret>@<cloud_name> (copy จากหน้า Dashboard ของ Cloudinary)
cloudinary.url=${CLOUDINARY_URL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Cache ไฟล์ static (css / js / รูป icon) ----
# ให้เบราว์เซอร์เก็บไว้ 7 วัน เปิดหน้าถัดไปไม่ต้องโหลด icon ~30 ไฟล์ใหม่ทุกครั้ง (เว็บบน Render เร็วขึ้น)
# แก้ css แล้ว deploy ใหม่ คนที่เคยเปิดเว็บกด Ctrl + F5 เพื่อโหลดของใหม่
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
