spring.application.name=plantpal

# ---- PostgreSQL (แก้ชื่อ DB / user / password ให้ตรงเครื่อง) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/plantpal
spring.datasource.username=postgres
spring.datasource.password=postgres

# ให้ Hibernate สร้าง/อัปเดตตารางจาก Entity เอง (ไม่ต้องเขียน SQL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
