<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<!-- ไฟล์นี้ไม่ได้เปิดเป็นหน้าเว็บเอง เก็บแค่ "ชิ้นส่วน" (fragment) ให้หน้าอื่นดึงไปใช้ -->

<!-- 1) ส่วน <head>: รับชื่อหน้าเป็นพารามิเตอร์ -->
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title th:text="${title} + ' · PlantPal'">PlantPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- 2) Sidebar: รับชื่อเมนูที่กำลังเปิด เพื่อไฮไลต์ (dashboard, plants, care, reports, notifications) -->
<aside class="sidebar" th:fragment="sidebar(active)">
    <a class="brand" th:href="@{/dashboard}"><span class="brand-mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-9 6-15 15-15 0 9-6 15-15 15z"/><path d="M5 19 13 11"/></svg></span><span><span class="brand-name">PlantPal</span><br><span class="brand-tag">ดูแลต้นไม้... ให้เติบโตไปกับคุณ</span></span></a>
    
    <nav class="nav" aria-label="เมนูหลัก"><a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>หน้าหลัก</a><a th:href="@{/plants}" th:classappend="${active == 'plants'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20v-8"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/><path d="M7 20h10"/></svg>ต้นไม้ของฉัน</a><a th:href="@{/care}" th:classappend="${active == 'care'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg>การดูแล</a><a th:href="@{/reports}" th:classappend="${active == 'reports'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>สุขภาพ</a><a th:href="@{/notifications}" th:classappend="${active == 'notifications'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>แจ้งเตือน</a></nav>
    <div class="buddy"><svg width="44" height="44" viewBox="0 0 96 96" aria-hidden="true"><ellipse cx="36" cy="22" rx="7" ry="18" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><ellipse cx="36" cy="24" rx="3" ry="11" fill="#f6c9cf"/><ellipse cx="58" cy="22" rx="7" ry="18" fill="#fff" stroke="#8a6d5c" stroke-width="2" transform="rotate(12 58 22)"/><ellipse cx="58" cy="24" rx="3" ry="11" fill="#f6c9cf" transform="rotate(12 58 24)"/><ellipse cx="47" cy="78" rx="18" ry="14" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><circle cx="47" cy="52" r="20" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><circle cx="40" cy="50" r="2.4" fill="#3b2e28"/><circle cx="54" cy="50" r="2.4" fill="#3b2e28"/><ellipse cx="35" cy="57" rx="4" ry="2.5" fill="#f6c9cf"/><ellipse cx="59" cy="57" rx="4" ry="2.5" fill="#f6c9cf"/><path d="M44 56q3 3 6 0" stroke="#3b2e28" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><div><strong>น้องปุยคู่ใจ</strong>ต้นไม้สดชื่น วันนี้ดูแลไปแล้วหรือยังนะ?</div></div>
    <a class="logout" th:href="@{/logout}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>ออกจากระบบ</a>
  </aside>

<!-- 3) Topbar -->
<header class="topbar" th:fragment="topbar">
      <span class="date-pill"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>วันนี้คือ <b th:text="${#temporals.format(#temporals.createToday(), 'd MMM yyyy')}">19 ก.ย. 2026</b></span>
      <div class="top-right">
        <a class="bell" th:href="@{/notifications}" aria-label="แจ้งเตือน"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg></a>
        <a class="user-chip" th:href="@{/profile}"><span class="avatar"><svg width="40" height="40" viewBox="0 0 96 96" aria-hidden="true"><ellipse cx="36" cy="22" rx="7" ry="18" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><ellipse cx="36" cy="24" rx="3" ry="11" fill="#f6c9cf"/><ellipse cx="58" cy="22" rx="7" ry="18" fill="#fff" stroke="#8a6d5c" stroke-width="2" transform="rotate(12 58 22)"/><ellipse cx="58" cy="24" rx="3" ry="11" fill="#f6c9cf" transform="rotate(12 58 24)"/><ellipse cx="47" cy="78" rx="18" ry="14" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><circle cx="47" cy="52" r="20" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><circle cx="40" cy="50" r="2.4" fill="#3b2e28"/><circle cx="54" cy="50" r="2.4" fill="#3b2e28"/><ellipse cx="35" cy="57" rx="4" ry="2.5" fill="#f6c9cf"/><ellipse cx="59" cy="57" rx="4" ry="2.5" fill="#f6c9cf"/><path d="M44 56q3 3 6 0" stroke="#3b2e28" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></span><span class="who"><b data-field="user_profiles.first_name">มุกดา</b><small data-field="users.role">สมาชิก</small></span></a>
      </div>
    </header>

<!-- 4) Script ท้ายหน้า -->
<th:block th:fragment="scripts">
  <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
