<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<!-- ไฟล์นี้ไม่ได้เปิดเป็นหน้าเว็บเอง เก็บแค่ "ชิ้นส่วน" (fragment) ให้หน้าอื่นดึงไปใช้ -->

<!-- 1) ส่วน <head>: รับชื่อหน้าเป็นพารามิเตอร์ -->
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title th:text="${title} + ' · PlantPal'">PlantPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/base.css}">
</head>

<body>

<!-- 2) Sidebar: รับชื่อเมนูที่กำลังเปิด เพื่อไฮไลต์ (dashboard, plants, care, calendar, reports, notifications,
     admin-users, admin-species, admin-reports) -->
<aside class="sidebar" th:fragment="sidebar(active)">
    <a class="brand" th:href="@{/dashboard}"><span class="brand-mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-9 6-15 15-15 0 9-6 15-15 15z"/><path d="M5 19 13 11"/></svg></span><span><span class="brand-name">PlantPal</span><br><span class="brand-tag">ดูแลต้นไม้... ให้เติบโตไปกับคุณ</span></span></a>
    
    <!-- เมนู ADMIN: แสดงเมื่อ isAdmin = true (มาจาก GlobalWebModelAdvice) -->
    <th:block th:if="${isAdmin}">
      <div class="mode admin"><span><span class="dot"></span>ผู้ดูแลระบบ</span><span class="small">ADMIN</span></div>
      <nav class="nav" aria-label="เมนูผู้ดูแลระบบ"><a th:href="@{/admin/reports}" th:classappend="${active == 'admin-reports'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>รายงานสุขภาพ</a><a th:href="@{/admin/species}" th:classappend="${active == 'admin-species'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V11"/><path d="M12 11c0-4 3-7 8-7 0 5-3 8-8 7z"/><path d="M12 14c0-3-2-6-7-6 0 4 3 7 7 6z"/></svg>พันธุ์ไม้</a><a th:href="@{/admin/users}" th:classappend="${active == 'admin-users'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>ผู้ใช้</a></nav>
    </th:block>

    <!-- เมนู USER -->
    <nav class="nav" aria-label="เมนูหลัก" th:unless="${isAdmin}"><a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>หน้าหลัก</a><a th:href="@{/plants}" th:classappend="${active == 'plants'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20v-8"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/><path d="M7 20h10"/></svg>ต้นไม้ของฉัน</a><a th:href="@{/care}" th:classappend="${active == 'care'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg>การดูแล</a><a th:href="@{/care/calendar}" th:classappend="${active == 'calendar'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>ปฏิทิน</a><a th:href="@{/reports}" th:classappend="${active == 'reports'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>สุขภาพ</a><a th:href="@{/notifications}" th:classappend="${active == 'notifications'} ? 'active'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>แจ้งเตือน</a></nav>

    
    <div class="buddy"><svg width="44" height="44" viewBox="0 0 96 96" aria-hidden="true"><ellipse cx="36" cy="22" rx="7" ry="18" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><ellipse cx="36" cy="24" rx="3" ry="11" fill="#f6c9cf"/><ellipse cx="58" cy="22" rx="7" ry="18" fill="#fff" stroke="#8a6d5c" stroke-width="2" transform="rotate(12 58 22)"/><ellipse cx="58" cy="24" rx="3" ry="11" fill="#f6c9cf" transform="rotate(12 58 24)"/><ellipse cx="47" cy="78" rx="18" ry="14" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><circle cx="47" cy="52" r="20" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><circle cx="40" cy="50" r="2.4" fill="#3b2e28"/><circle cx="54" cy="50" r="2.4" fill="#3b2e28"/><ellipse cx="35" cy="57" rx="4" ry="2.5" fill="#f6c9cf"/><ellipse cx="59" cy="57" rx="4" ry="2.5" fill="#f6c9cf"/><path d="M44 56q3 3 6 0" stroke="#3b2e28" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><div><strong>น้องปุยคู่ใจ</strong><span th:text="${isAdmin} ? 'ตรวจรายงานที่รอตอบก่อนนะ' : 'ต้นไม้สดชื่น วันนี้ดูแลไปแล้วหรือยังนะ?'">ต้นไม้สดชื่น วันนี้ดูแลไปแล้วหรือยังนะ?</span></div></div>
    <!-- logout ต้องเป็น POST (Spring Security) th:action ใส่ CSRF token ให้เอง -->
    <form class="logout-form" th:action="@{/logout}" method="post" data-live><button type="submit" class="logout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>ออกจากระบบ</button></form>
  </aside>

<!-- 3) Topbar -->
<header class="topbar" th:fragment="topbar">
      <span class="date-pill"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>วันนี้คือ <b th:text="${#temporals.format(#temporals.createToday(), 'd MMM yyyy')}">19 ก.ย. 2026</b></span>
      <div class="top-right">
        <!-- กระดิ่งแจ้งเตือน (fragment ของเปรม) ข้อมูลส่งมาจาก NotificationModelAdvice -->
        <div th:replace="~{fragments/notification-bell :: bell}"></div>
        <a class="user-chip" th:href="@{/profile}"><span class="avatar"><img th:if="${navUser != null and navUser.avatarUrl != null}" th:src="@{${navUser.avatarUrl}}" alt="" width="40" height="40"><th:block th:unless="${navUser != null and navUser.avatarUrl != null}"><svg width="40" height="40" viewBox="0 0 96 96" aria-hidden="true"><ellipse cx="36" cy="22" rx="7" ry="18" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><ellipse cx="36" cy="24" rx="3" ry="11" fill="#f6c9cf"/><ellipse cx="58" cy="22" rx="7" ry="18" fill="#fff" stroke="#8a6d5c" stroke-width="2" transform="rotate(12 58 22)"/><ellipse cx="58" cy="24" rx="3" ry="11" fill="#f6c9cf" transform="rotate(12 58 24)"/><ellipse cx="47" cy="78" rx="18" ry="14" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><circle cx="47" cy="52" r="20" fill="#fff" stroke="#8a6d5c" stroke-width="2"/><circle cx="40" cy="50" r="2.4" fill="#3b2e28"/><circle cx="54" cy="50" r="2.4" fill="#3b2e28"/><ellipse cx="35" cy="57" rx="4" ry="2.5" fill="#f6c9cf"/><ellipse cx="59" cy="57" rx="4" ry="2.5" fill="#f6c9cf"/><path d="M44 56q3 3 6 0" stroke="#3b2e28" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></th:block></span><span class="who"><b th:text="${navUser != null} ? ${navUser.name} : ''">มุกดา</b><small data-field="users.role" th:text="${isAdmin} ? 'ผู้ดูแลระบบ' : 'สมาชิก'">สมาชิก</small></span></a>
      </div>
    </header>

<!-- 4) Footer: วางไว้ใน <div class="main"> ต่อจาก </main> -->
<footer class="footer" th:fragment="footer">
  <span>© <span th:text="${#temporals.year(#temporals.createToday())}">2026</span> PlantPal</span>
  <span class="muted">CP353002 Software Design and Development</span>
</footer>

<!-- 5) Script ท้ายหน้า -->
<th:block th:fragment="scripts">
  <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
