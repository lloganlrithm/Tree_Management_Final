<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('โปรไฟล์')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/users.css}">
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar('profile')}"></aside>

  <div class="main">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <main class="content profile-page">
      <div class="page-head">
        <div>
          <h1>โปรไฟล์</h1>
          <p>จัดการข้อมูลส่วนตัวและบัญชีของคุณ</p>
        </div>
      </div>

      <div class="flash ok" th:if="${success}" th:text="${success}">บันทึกแล้ว</div>
      <div class="flash err" th:if="${error}" th:text="${error}">เกิดข้อผิดพลาด</div>

      <section class="card profile-head">
        <div class="avatar-lg">
          <!-- ยังไม่มีรูป ใช้น้องปุยแทน -->
          <img id="avatar-img" th:src="${profile.avatarUrl != null} ? @{${profile.avatarUrl}} : @{/img/mascot.svg}" alt="รูปโปรไฟล์">
        </div>
        <div class="grow">
          <div class="profile-title">
            <div>
              <h2 th:text="${(profile.firstName ?: '') + ' ' + (profile.lastName ?: '')}">มุกดา บุญประจันทร์</h2>
              <span class="muted small" th:text="${profile.email}">mukda@example.com</span>
            </div>
            <span class="badge plain s-HEALTHY" th:text="${profile.role.name() == 'ADMIN'} ? 'ผู้ดูแลระบบ' : 'สมาชิก'">สมาชิก</span>
          </div>
          <div class="profile-stats">
            <div><div class="k">ต้นไม้ในครอบครอง</div><div class="v" th:text="${profile.plantCount} + ' ต้น'">8 ต้น</div></div>
            <div><div class="k">บันทึกการดูแลสะสม</div><div class="v v-primary" th:text="${profile.careLogCount} + ' ครั้ง'">10 ครั้ง</div></div>
            <div><div class="k">เริ่มใช้งาน</div><div class="v" th:text="${#temporals.format(profile.createdAt, 'MMM yyyy')}">พ.ค. 2026</div></div>
          </div>
        </div>
      </section>

      <form class="card card-pad stack" th:action="@{/profile}" method="post" enctype="multipart/form-data" data-live>
        <h2>ข้อมูลส่วนตัว</h2>
        <div class="form-grid">
          <div class="field">
            <label for="f-first">ชื่อ</label>
            <input class="input" id="f-first" name="firstName" maxlength="100" th:value="${profile.firstName}" required>
          </div>
          <div class="field">
            <label for="f-last">นามสกุล</label>
            <input class="input" id="f-last" name="lastName" maxlength="100" th:value="${profile.lastName}" required>
          </div>
          <div class="field">
            <label for="f-email">อีเมล</label>
            <input class="input" id="f-email" th:value="${profile.email}" readonly>
            <span class="hint">ใช้เข้าสู่ระบบ เปลี่ยนไม่ได้</span>
          </div>
          <div class="field">
            <label for="f-phone">เบอร์โทรศัพท์</label>
            <input class="input" id="f-phone" name="phoneNumber" type="tel" maxlength="20" placeholder="08x-xxx-xxxx" th:value="${profile.phoneNumber}">
          </div>
          <div class="field full">
            <span class="field-label">รูปโปรไฟล์</span>
            <label class="drop" for="f-avatar">
              <span class="icon icon-upload"></span><br>
              อัปโหลดรูปใหม่ (PNG, JPG, GIF, WEBP ไม่เกิน 5MB) · ถ้าไม่มีรูป ระบบจะแสดงน้องปุยแทน<br><span class="small file-name" data-file-name></span>
              <img class="drop-preview" data-file-preview alt="รูปที่เลือก" hidden>
              <input type="file" id="f-avatar" name="avatar" data-preview-target="#avatar-img" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
            </label>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">บันทึกข้อมูล</button>
        </div>
      </form>

      <form class="card card-pad stack" th:action="@{/profile/password}" method="post" data-live>
        <h2>เปลี่ยนรหัสผ่าน</h2>
        <div class="form-grid">
          <div class="field full">
            <label for="pw-old">รหัสผ่านปัจจุบัน</label>
            <input class="input" id="pw-old" name="currentPassword" type="password" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label for="pw-new">รหัสผ่านใหม่</label>
            <input class="input" id="pw-new" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="field">
            <label for="pw-new2">ยืนยันรหัสผ่านใหม่</label>
            <input class="input" id="pw-new2" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
          </div>
        </div>
        <div class="form-actions between">
          <button type="submit" form="logout-form" class="btn btn-danger"><span class="icon icon-logout"></span>ออกจากระบบ</button>
          <button type="submit" class="btn btn-primary"><span class="icon icon-lock"></span>เปลี่ยนรหัสผ่าน</button>
        </div>
      </form>

      <form id="logout-form" th:action="@{/logout}" method="post" data-live hidden></form>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/users.js}"></script>
</body>
</html>
