<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('โปรไฟล์')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/users.css}">
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar('profile')}"></aside>

  <div class="main">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>โปรไฟล์</h1>
          <p>จัดการข้อมูลส่วนตัวและบัญชีของคุณ</p>
        </div>
      </div>

      <!-- ข้อมูลตัวอย่าง: รอเชื่อม UserService -->
      <section class="card profile-head">
        <div class="avatar-lg">
          <img id="avatar-preview" th:src="@{/img/mascot.svg}" alt="รูปโปรไฟล์">
        </div>
        <div class="grow">
          <div class="profile-title">
            <div>
              <h2>พรีมภัทร ภาวัฒนวคุณ</h2>
              <span class="muted small">prim@example.com</span>
            </div>
            <span class="badge plain s-HEALTHY">สมาชิก</span>
          </div>
          <div class="profile-stats">
            <div><div class="k">อีเมล</div><div class="v">prim@example.com</div></div>
            <div><div class="k">สิทธิ์</div><div class="v">USER</div></div>
            <div><div class="k">เริ่มใช้งาน</div><div class="v">1 พ.ค. 2026</div></div>
          </div>
        </div>
      </section>

      <form class="card card-pad stack" th:action="@{/profile}" method="post">
        <h2>ข้อมูลส่วนตัว</h2>
        <div class="form-grid">
          <div class="field">
            <label for="f-first">ชื่อ</label>
            <input class="input" id="f-first" name="firstName" maxlength="100" value="พรีมภัทร" required>
          </div>
          <div class="field">
            <label for="f-last">นามสกุล</label>
            <input class="input" id="f-last" name="lastName" maxlength="100" value="ภาวัฒนวคุณ" required>
          </div>
          <div class="field">
            <label for="f-email">อีเมล</label>
            <input class="input" id="f-email" value="prim@example.com" readonly>
            <span class="hint">ใช้เข้าสู่ระบบ เปลี่ยนไม่ได้</span>
          </div>
          <div class="field">
            <label for="f-phone">เบอร์โทรศัพท์</label>
            <input class="input" id="f-phone" name="phoneNumber" type="tel" maxlength="20" placeholder="08x-xxx-xxxx">
          </div>
          <div class="field full">
            <label for="f-avatar">ลิงก์รูปโปรไฟล์</label>
            <input class="input" id="f-avatar" name="avatarUrl" type="url" maxlength="500"
                   placeholder="https://..." data-preview="#avatar-preview">
            <span class="hint">ถ้าไม่ใส่ ระบบจะแสดงน้องปุยแทน</span>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">บันทึกข้อมูล</button>
        </div>
      </form>

      <div class="form-actions">
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="btn btn-danger">ออกจากระบบ</button>
        </form>
      </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/users.js}"></script>
</body>
</html>
